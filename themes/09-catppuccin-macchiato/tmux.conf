# theme: catppuccin-macchiato
set -g status on
set -g status-position bottom
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#c6a0f6,fg=#24273a,bold] #S #[bg=#24273a,fg=#c6a0f6,nobold] "
set -g status-right "#[fg=#cad3f5]%Y-%m-%d %H:%M #[bg=#c6a0f6,fg=#24273a,bold] #h "
setw -g window-status-current-style "bg=#c6a0f6,fg=#24273a,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#cad3f5"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#c6a0f6,fg=#24273a"
