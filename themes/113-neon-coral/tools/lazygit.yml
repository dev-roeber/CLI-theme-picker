# lazygit theme — symlinked to ~/.config/lazygit/theme.yml; include via LG_CONFIG_FILE
gui:
  theme:
    lightTheme: false
    activeBorderColor:
      - "#ff7f50"
      - bold
    inactiveBorderColor:
      - "#414868"
    optionsTextColor:
      - "#ff7f50"
    selectedLineBgColor:
      - "#414868"
    selectedRangeBgColor:
      - "#414868"
    cherryPickedCommitBgColor:
      - "#ff7f50"
    cherryPickedCommitFgColor:
      - "#140505"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#ff6f61"
