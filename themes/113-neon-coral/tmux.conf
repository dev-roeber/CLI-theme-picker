# theme: neon-coral
set -g status on
set -g status-position bottom
set -g status-style "bg=#140505,fg=#ff6f61"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff7f50,fg=#140505,bold] #S #[bg=#140505,fg=#ff7f50,nobold] "
set -g status-right "#[fg=#ff6f61]%Y-%m-%d %H:%M #[bg=#ff7f50,fg=#140505,bold] #h "
setw -g window-status-current-style "bg=#ff7f50,fg=#140505,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#ff6f61"
set -g pane-active-border-style "fg=#ff7f50"
set -g message-style "bg=#ff7f50,fg=#140505"
