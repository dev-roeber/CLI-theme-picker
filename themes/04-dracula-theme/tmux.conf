# theme: dracula-theme
set -g status on
set -g status-position bottom
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9,nobold] "
set -g status-right "#[fg=#f8f8f2]%Y-%m-%d %H:%M #[bg=#bd93f9,fg=#282a36,bold] #h "
setw -g window-status-current-style "bg=#bd93f9,fg=#282a36,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#f8f8f2"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#bd93f9,fg=#282a36"
