set -g status on
set -g status-position bottom
set -g status-style "bg=#1a1a1a,fg=#fab387"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff6b35,fg=#1a1a1a,bold] #S #[bg=#1a1a1a,fg=#ff6b35,nobold] "
set -g status-right "#[fg=#fab387]%Y-%m-%d %H:%M #[bg=#ff6b35,fg=#1a1a1a,bold] #h "
setw -g window-status-current-style "bg=#ff6b35,fg=#1a1a1a,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#fab387"
set -g pane-active-border-style "fg=#ff6b35"
set -g message-style "bg=#ff6b35,fg=#1a1a1a"
