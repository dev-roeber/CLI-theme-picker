# theme: neon-orange
set -g status on
set -g status-position bottom
set -g status-style "bg=#140a00,fg=#ff7f00"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff6700,fg=#140a00,bold] #S #[bg=#140a00,fg=#ff6700,nobold] "
set -g status-right "#[fg=#ff7f00]%Y-%m-%d %H:%M #[bg=#ff6700,fg=#140a00,bold] #h "
setw -g window-status-current-style "bg=#ff6700,fg=#140a00,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#ff7f00"
set -g pane-active-border-style "fg=#ff6700"
set -g message-style "bg=#ff6700,fg=#140a00"
