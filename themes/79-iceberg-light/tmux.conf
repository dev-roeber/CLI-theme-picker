# theme: iceberg-light
set -g status on
set -g status-position bottom
set -g status-style "bg=#e8e9ec,fg=#33374c"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#2d539e,fg=#e8e9ec,bold] #S #[bg=#e8e9ec,fg=#2d539e,nobold] "
set -g status-right "#[fg=#33374c]%Y-%m-%d %H:%M #[bg=#2d539e,fg=#e8e9ec,bold] #h "
setw -g window-status-current-style "bg=#2d539e,fg=#e8e9ec,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#33374c"
set -g pane-active-border-style "fg=#2d539e"
set -g message-style "bg=#2d539e,fg=#e8e9ec"
