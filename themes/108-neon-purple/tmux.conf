# theme: neon-purple
set -g status on
set -g status-position bottom
set -g status-style "bg=#0d0014,fg=#b026ff"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#bf00ff,fg=#0d0014,bold] #S #[bg=#0d0014,fg=#bf00ff,nobold] "
set -g status-right "#[fg=#b026ff]%Y-%m-%d %H:%M #[bg=#bf00ff,fg=#0d0014,bold] #h "
setw -g window-status-current-style "bg=#bf00ff,fg=#0d0014,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#b026ff"
set -g pane-active-border-style "fg=#bf00ff"
set -g message-style "bg=#bf00ff,fg=#0d0014"
