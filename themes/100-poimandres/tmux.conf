# theme: poimandres
set -g status on
set -g status-position bottom
set -g status-style "bg=#1b1e28,fg=#a6accd"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#5de4c7,fg=#1b1e28,bold] #S #[bg=#1b1e28,fg=#5de4c7,nobold] "
set -g status-right "#[fg=#a6accd]%Y-%m-%d %H:%M #[bg=#5de4c7,fg=#1b1e28,bold] #h "
setw -g window-status-current-style "bg=#5de4c7,fg=#1b1e28,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#a6accd"
set -g pane-active-border-style "fg=#5de4c7"
set -g message-style "bg=#5de4c7,fg=#1b1e28"
