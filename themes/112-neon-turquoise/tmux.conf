# theme: neon-turquoise
set -g status on
set -g status-position bottom
set -g status-style "bg=#001414,fg=#00ced1"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#40e0d0,fg=#001414,bold] #S #[bg=#001414,fg=#40e0d0,nobold] "
set -g status-right "#[fg=#00ced1]%Y-%m-%d %H:%M #[bg=#40e0d0,fg=#001414,bold] #h "
setw -g window-status-current-style "bg=#40e0d0,fg=#001414,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#00ced1"
set -g pane-active-border-style "fg=#40e0d0"
set -g message-style "bg=#40e0d0,fg=#001414"
