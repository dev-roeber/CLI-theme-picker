# theme: synthwave-84
set -g status on
set -g status-position bottom
set -g status-style "bg=#241b2f,fg=#f7f7ff"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff7edb,fg=#241b2f,bold] #S #[bg=#241b2f,fg=#ff7edb,nobold] "
set -g status-right "#[fg=#f7f7ff]%Y-%m-%d %H:%M #[bg=#ff7edb,fg=#241b2f,bold] #h "
setw -g window-status-current-style "bg=#ff7edb,fg=#241b2f,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#f7f7ff"
set -g pane-active-border-style "fg=#ff7edb"
set -g message-style "bg=#ff7edb,fg=#241b2f"
