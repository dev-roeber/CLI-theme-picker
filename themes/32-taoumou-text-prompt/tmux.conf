set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7e9cd8,fg=default,bold] #S #[bg=default,fg=#7e9cd8,nobold] "
set -g status-right "#[fg=default]%Y-%m-%d %H:%M #[bg=#7e9cd8,fg=default,bold] #h "
setw -g window-status-current-style "bg=#7e9cd8,fg=default,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#7e9cd8,fg=default"
