# theme: deep-sea
set -g status on
set -g status-position bottom
set -g status-style "bg=#0a192f,fg=#8892b0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#64ffda,fg=#0a192f,bold] #S #[bg=#0a192f,fg=#64ffda,nobold] "
set -g status-right "#[fg=#8892b0]%Y-%m-%d %H:%M #[bg=#64ffda,fg=#0a192f,bold] #h "
setw -g window-status-current-style "bg=#64ffda,fg=#0a192f,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#8892b0"
set -g pane-active-border-style "fg=#64ffda"
set -g message-style "bg=#64ffda,fg=#0a192f"
