# theme: night-owl
set -g status on
set -g status-position bottom
set -g status-style "bg=#011627,fg=#d6deeb"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#82aaff,fg=#011627,bold] #S #[bg=#011627,fg=#82aaff,nobold] "
set -g status-right "#[fg=#d6deeb]%Y-%m-%d %H:%M #[bg=#82aaff,fg=#011627,bold] #h "
setw -g window-status-current-style "bg=#82aaff,fg=#011627,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#d6deeb"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#82aaff,fg=#011627"
