# theme: solarized-dark
set -g status on
set -g status-position bottom
set -g status-style "bg=#002b36,fg=#839496"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#268bd2,fg=#002b36,bold] #S #[bg=#002b36,fg=#268bd2,nobold] "
set -g status-right "#[fg=#839496]%Y-%m-%d %H:%M #[bg=#268bd2,fg=#002b36,bold] #h "
setw -g window-status-current-style "bg=#268bd2,fg=#002b36,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#839496"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#268bd2,fg=#002b36"
