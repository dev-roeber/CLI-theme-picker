# theme: dracula-palette
set -g status on
set -g status-position bottom
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff79c6,fg=#282a36,bold] #S #[bg=#282a36,fg=#ff79c6,nobold] "
set -g status-right "#[fg=#f8f8f2]%Y-%m-%d %H:%M #[bg=#ff79c6,fg=#282a36,bold] #h "
setw -g window-status-current-style "bg=#ff79c6,fg=#282a36,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#f8f8f2"
set -g pane-active-border-style "fg=#ff79c6"
set -g message-style "bg=#ff79c6,fg=#282a36"
