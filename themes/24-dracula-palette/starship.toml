"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = """
$username$hostname$directory$git_branch$git_status$nodejs$python$docker_context$cmd_duration$line_break$status$character"""

palette = "main"

[palettes.main]
bg = "#282a36"
fg = "#f8f8f2"
accent = "#ff79c6"
muted = "#7f848e"

[username]
style_user = "fg:accent bold"
show_always = true
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "fg:accent"
format = "[$hostname]($style) "

[directory]
style = "fg:fg bold"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
symbol = " "
style = "fg:accent"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:muted"
format = "[$all_status$ahead_behind]($style) "

[nodejs]
symbol = " "
format = "[$symbol($version) ]($style)"
style = "fg:muted"

[python]
symbol = " "
format = "[$symbol($version) ]($style)"
style = "fg:muted"

[docker_context]
symbol = " "
format = "[$symbol$context ]($style)"
style = "fg:muted"

[cmd_duration]
min_time = 1000
style = "fg:muted"
format = "[ took $duration ]($style)"

[status]
disabled = false
symbol = "x "
style = "fg:red"
format = "[$symbol$status]($style)"

[character]
success_symbol = "[>](fg:accent bold)"
error_symbol = "[>](fg:red bold)"
