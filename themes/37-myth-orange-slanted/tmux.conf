# theme: 37-myth-orange-slanted
set -g status on
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#fab387"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#f38ba8,fg=#1e1e2e,bold] #S #[bg=#fab387,fg=#1e1e2e] #[bg=#1e1e2e,fg=#fab387,nobold] "
set -g status-right "#[fg=#fab387]%Y-%m-%d %H:%M #[bg=#f38ba8,fg=#1e1e2e,bold] #h "
setw -g window-status-current-style "bg=#f38ba8,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#fab387"
set -g pane-active-border-style "fg=#f38ba8"
set -g message-style "bg=#f38ba8,fg=#1e1e2e"
