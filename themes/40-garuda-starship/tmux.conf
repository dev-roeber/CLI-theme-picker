set -g status on
set -g status-position bottom
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#fb4934,fg=#1d2021,bold] #S #[bg=#1d2021,fg=#fb4934,nobold] "
set -g status-right "#[fg=#ebdbb2]%Y-%m-%d %H:%M #[bg=#fb4934,fg=#1d2021,bold] #h "
setw -g window-status-current-style "bg=#fb4934,fg=#1d2021,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#ebdbb2"
set -g pane-active-border-style "fg=#fb4934"
set -g message-style "bg=#fb4934,fg=#1d2021"
