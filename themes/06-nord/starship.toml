"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$status\
$character"""

palette = "main"

[palettes.main]
bg = "#2e3440"
fg = "#d8dee9"
accent = "#5e81ac"
muted = "#4c566a"
red = "#cc6666"

[username]
style_user = "fg:accent bold"
show_always = true
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "fg:accent"
format = "[$hostname]($style) "

[directory]
style = "fg:fg bold"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
symbol = "git:"
style = "fg:accent"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:muted"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 1000
style = "fg:muted"
format = "[ took $duration ]($style)"

[status]
disabled = false
symbol = "X "
style = "fg:red"
format = "[$symbol$status]($style)"

[character]
success_symbol = "[>](fg:accent bold)"
error_symbol = "[>](fg:red bold)"
