set -g status on
set -g status-position bottom
set -g status-style "bg=#2e3440,fg=#eceff4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0,nobold] "
set -g status-right "#[fg=#eceff4]%Y-%m-%d %H:%M #[bg=#88c0d0,fg=#2e3440,bold] #h "
setw -g window-status-current-style "bg=#88c0d0,fg=#2e3440,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#eceff4"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#88c0d0,fg=#2e3440"
