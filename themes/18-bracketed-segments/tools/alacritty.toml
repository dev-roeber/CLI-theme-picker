[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#87afd7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"
