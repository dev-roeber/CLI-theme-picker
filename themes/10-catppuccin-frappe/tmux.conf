# theme: catppuccin-frappe
set -g status on
set -g status-position bottom
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ca9ee6,fg=#303446,bold] #S #[bg=#303446,fg=#ca9ee6,nobold] "
set -g status-right "#[fg=#c6d0f5]%Y-%m-%d %H:%M #[bg=#ca9ee6,fg=#303446,bold] #h "
setw -g window-status-current-style "bg=#ca9ee6,fg=#303446,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#c6d0f5"
set -g pane-active-border-style "fg=#ca9ee6"
set -g message-style "bg=#ca9ee6,fg=#303446"
