set -g status on
set -g status-position bottom
set -g status-style "bg=#333c43,fg=#d3c6aa"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7fbbb3,fg=#333c43,bold] #S #[bg=#333c43,fg=#7fbbb3,nobold] "
set -g status-right "#[fg=#d3c6aa]%Y-%m-%d %H:%M #[bg=#7fbbb3,fg=#333c43,bold] #h "
setw -g window-status-current-style "bg=#7fbbb3,fg=#333c43,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#d3c6aa"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=#7fbbb3,fg=#333c43"
