# theme: panda
set -g status on
set -g status-position bottom
set -g status-style "bg=#292a2b,fg=#e6e6e6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#ff75b5,fg=#292a2b,bold] #S #[bg=#292a2b,fg=#ff75b5,nobold] "
set -g status-right "#[fg=#e6e6e6]%Y-%m-%d %H:%M #[bg=#ff75b5,fg=#292a2b,bold] #h "
setw -g window-status-current-style "bg=#ff75b5,fg=#292a2b,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#e6e6e6"
set -g pane-active-border-style "fg=#ff75b5"
set -g message-style "bg=#ff75b5,fg=#292a2b"
