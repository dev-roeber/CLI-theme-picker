# alacritty theme: 12-pastel-powerline — include via:  import = ["~/.config/theme-picker/active/alacritty.toml"]
[colors.primary]
background = "#1e1e1e"
foreground = "#dcdcdc"

[colors.cursor]
text   = "#1e1e1e"
cursor = "#ffd6a5"

[colors.selection]
text       = "#dcdcdc"
background = "#414868"

[colors.normal]
black   = "#1e1e1e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#ffd6a5"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#ffd6a5"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#dcdcdc"
