# theme: pop-os
set -g status on
set -g status-position bottom
set -g status-style "bg=#1a1a1a,fg=#cccccc"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#48b9c7,fg=#1a1a1a,bold] #S #[bg=#1a1a1a,fg=#48b9c7,nobold] "
set -g status-right "#[fg=#cccccc]%Y-%m-%d %H:%M #[bg=#48b9c7,fg=#1a1a1a,bold] #h "
setw -g window-status-current-style "bg=#48b9c7,fg=#1a1a1a,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#cccccc"
set -g pane-active-border-style "fg=#48b9c7"
set -g message-style "bg=#48b9c7,fg=#1a1a1a"
