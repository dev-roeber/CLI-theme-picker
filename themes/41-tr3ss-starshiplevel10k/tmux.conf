set -g status on
set -g status-position bottom
set -g status-style "bg=#1a1a1a,fg=#ffffff"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#5fafd7,fg=#1a1a1a,bold] #S #[bg=#1a1a1a,fg=#5fafd7,nobold] "
set -g status-right "#[fg=#ffffff]%Y-%m-%d %H:%M #[bg=#5fafd7,fg=#1a1a1a,bold] #h "
setw -g window-status-current-style "bg=#5fafd7,fg=#1a1a1a,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#ffffff"
set -g pane-active-border-style "fg=#5fafd7"
set -g message-style "bg=#5fafd7,fg=#1a1a1a"
