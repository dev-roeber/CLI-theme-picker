# theme: gruvbox-rainbow
set -g status on
set -g status-position bottom
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#fabd2f,fg=#282828,bold] #S #[bg=#282828,fg=#fabd2f,nobold] "
set -g status-right "#[fg=#ebdbb2]%Y-%m-%d %H:%M #[bg=#fabd2f,fg=#282828,bold] #h "
setw -g window-status-current-style "bg=#fabd2f,fg=#282828,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#ebdbb2"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
