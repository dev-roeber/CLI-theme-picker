# theme: catppuccin-latte
set -g status on
set -g status-position bottom
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#8839ef,fg=#eff1f5,bold] #S #[bg=#eff1f5,fg=#8839ef,nobold] "
set -g status-right "#[fg=#4c4f69]%Y-%m-%d %H:%M #[bg=#8839ef,fg=#eff1f5,bold] #h "
setw -g window-status-current-style "bg=#8839ef,fg=#eff1f5,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#4c4f69"
set -g pane-active-border-style "fg=#8839ef"
set -g message-style "bg=#8839ef,fg=#eff1f5"
