# theme: railscasts
set -g status on
set -g status-position bottom
set -g status-style "bg=#2b2b2b,fg=#e6e1dc"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#cc7833,fg=#2b2b2b,bold] #S #[bg=#2b2b2b,fg=#cc7833,nobold] "
set -g status-right "#[fg=#e6e1dc]%Y-%m-%d %H:%M #[bg=#cc7833,fg=#2b2b2b,bold] #h "
setw -g window-status-current-style "bg=#cc7833,fg=#2b2b2b,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#e6e1dc"
set -g pane-active-border-style "fg=#cc7833"
set -g message-style "bg=#cc7833,fg=#2b2b2b"
