# theme: zenburn
set -g status on
set -g status-position bottom
set -g status-style "bg=#3f3f3f,fg=#dcdccc"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#dca3a3,fg=#3f3f3f,bold] #S #[bg=#3f3f3f,fg=#dca3a3,nobold] "
set -g status-right "#[fg=#dcdccc]%Y-%m-%d %H:%M #[bg=#dca3a3,fg=#3f3f3f,bold] #h "
setw -g window-status-current-style "bg=#dca3a3,fg=#3f3f3f,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#dcdccc"
set -g pane-active-border-style "fg=#dca3a3"
set -g message-style "bg=#dca3a3,fg=#3f3f3f"
