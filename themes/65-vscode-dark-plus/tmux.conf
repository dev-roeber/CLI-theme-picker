# theme: vscode-dark-plus
set -g status on
set -g status-position bottom
set -g status-style "bg=#1e1e1e,fg=#d4d4d4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#569cd6,fg=#1e1e1e,bold] #S #[bg=#1e1e1e,fg=#569cd6,nobold] "
set -g status-right "#[fg=#d4d4d4]%Y-%m-%d %H:%M #[bg=#569cd6,fg=#1e1e1e,bold] #h "
setw -g window-status-current-style "bg=#569cd6,fg=#1e1e1e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#d4d4d4"
set -g pane-active-border-style "fg=#569cd6"
set -g message-style "bg=#569cd6,fg=#1e1e1e"
