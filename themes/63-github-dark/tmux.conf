# theme: github-dark
set -g status on
set -g status-position bottom
set -g status-style "bg=#0d1117,fg=#c9d1d9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#58a6ff,fg=#0d1117,bold] #S #[bg=#0d1117,fg=#58a6ff,nobold] "
set -g status-right "#[fg=#c9d1d9]%Y-%m-%d %H:%M #[bg=#58a6ff,fg=#0d1117,bold] #h "
setw -g window-status-current-style "bg=#58a6ff,fg=#0d1117,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#c9d1d9"
set -g pane-active-border-style "fg=#58a6ff"
set -g message-style "bg=#58a6ff,fg=#0d1117"
